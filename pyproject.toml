[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flowspan"
version = "0.1.0"
description = "One OpenTelemetry span per entry point, carrying its decisions and exceptions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["opentelemetry", "tracing", "observability", "entry-point", "metrics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = ["opentelemetry-api>=1.27"]

[project.optional-dependencies]
dev = [
  "opentelemetry-sdk>=1.27",
  "pyarrow>=17",
  "pre-commit>=3.7",
  "pyright>=1.1.390",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/Difknat/flowspan"
Source = "https://github.com/Difknat/flowspan"
Issues = "https://github.com/Difknat/flowspan/issues"
Changelog = "https://github.com/Difknat/flowspan/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspan"]

[tool.hatch.build.targets.sdist]
include = ["src/flowspan", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["internal"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "N"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["flowspan"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
